<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Job shortlist</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Sans+Condensed:wght@500;600&display=swap" rel="stylesheet">
<style>
:root{
  --paper:#F5F7F6; --surface:#FFFFFF; --ink:#17324D; --text:#1D2730; --muted:#5F6B76;
  --line:#D8DEE3; --strong:#1E7550; --strong-bg:#E3F1EA; --maybe:#9A6A12; --maybe-bg:#F7EEDB;
  --weak:#7A8590; --weak-bg:#ECEFF1; --focus:#2F6FB0;
  color-scheme:light;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:dark){
  :root{
    --paper:#11171D; --surface:#18212A; --ink:#C9DBEC; --text:#E3E9EE; --muted:#97A3AE;
    --line:#2A3540; --strong:#6FCF9F; --strong-bg:#173527; --maybe:#E2B35C; --maybe-bg:#3A2E16;
    --weak:#8B96A1; --weak-bg:#222C35; --focus:#7FB2E5;
    color-scheme:dark;
  }
}
*,*::before,*::after{box-sizing:border-box}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--paper);color:var(--text);
  font:15px/1.5 "IBM Plex Sans",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
a{color:var(--ink)}
button,select{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--focus);outline-offset:2px}
.wrap{max-width:860px;margin:0 auto;padding:20px 16px 56px}

/* ---------- shortlist page ---------- */
#board-view{margin:-20px calc(50% - 50vw) 0}
.bhero{background:var(--hero);color:var(--hero-text);padding:20px 20px 0}
.bhero-in{max-width:940px;margin:0 auto}
.back{display:inline-block;font-size:14px;color:var(--hero-muted);text-decoration:none;padding:4px 0}
.back:hover{color:var(--hero-text)}
.bh-row{display:flex;align-items:center;gap:14px;margin:14px 0 6px}
.bh-row .avatar{width:48px;height:48px;font-size:19px}
.bh-who{margin:0;color:var(--hero-muted);font-size:14px}
.bhero h1{font-family:"IBM Plex Sans Condensed","IBM Plex Sans",system-ui,sans-serif;font-weight:600;
  font-size:clamp(26px,4.4vw,38px);line-height:1.1;margin:2px 0 0;letter-spacing:-.01em}
.bh-sub{margin:4px 0 0;color:var(--hero-muted);font-size:14px}
.tabs{display:flex;gap:6px;margin:20px 0 0;overflow-x:auto;scrollbar-width:none}
.tabs::-webkit-scrollbar{display:none}
.tab{background:none;border:0;border-bottom:3px solid transparent;padding:10px 12px 11px;cursor:pointer;
  white-space:nowrap;color:var(--hero-muted);font-weight:500;font-size:15px}
.tab:hover{color:var(--hero-text)}
.tab[aria-selected="true"]{color:var(--hero-text);border-bottom-color:var(--hero-text)}
.tab .n{display:inline-block;margin-left:8px;font-size:12px;font-weight:600;padding:1px 7px;border-radius:99px;
  background:var(--hero-line);color:var(--hero-text);vertical-align:1px}
.bbody{max-width:980px;margin:0 auto;padding:20px 20px 56px}
.views{display:inline-flex;gap:2px;padding:3px;border-radius:10px;background:var(--surface);border:1px solid var(--line);margin:0 0 16px;flex-wrap:wrap}
.view{border:0;background:none;border-radius:8px;padding:6px 14px;cursor:pointer;font-size:14px;color:var(--muted);font-weight:500}
.view[aria-pressed="true"]{background:var(--acc);color:var(--surface)}
.list{list-style:none;margin:0;padding:0}
.job{position:relative;display:grid;grid-template-columns:64px 1fr;gap:4px 18px;padding:18px 20px 16px 18px;margin-bottom:12px;
  background:var(--surface);border:1px solid var(--line);border-radius:14px;box-shadow:0 1px 2px rgba(16,32,48,.05)}
.job::before{content:"";position:absolute;left:-1px;top:14px;bottom:14px;width:4px;border-radius:0 4px 4px 0;background:var(--line)}
.job.s-strong::before{background:var(--strong)} .job.s-maybe::before{background:var(--maybe)}
.score{grid-row:1 / span 3;align-self:start;text-align:center;border-radius:12px;padding:10px 0 8px;background:var(--weak-bg)}
.score b{display:block;font-family:"IBM Plex Sans Condensed","IBM Plex Sans",system-ui,sans-serif;
  font-weight:600;font-size:28px;line-height:1;font-variant-numeric:tabular-nums}
.score small{display:block;font-size:10.5px;color:var(--muted);margin-top:4px;line-height:1.15}
.score.s-strong{background:var(--strong-bg)} .score.s-strong b{color:var(--strong)}
.score.s-maybe{background:var(--maybe-bg)} .score.s-maybe b{color:var(--maybe)}
.score.s-weak b{color:var(--weak)}
.job h2{margin:0;font-size:17px;font-weight:600;line-height:1.3}
.co{margin:3px 0 0;font-size:14.5px;font-weight:500;color:var(--ink)}
.tags{display:flex;flex-wrap:wrap;gap:6px;margin:8px 0 0}
.tags span{font-size:12.5px;padding:2px 9px;border-radius:99px;background:var(--weak-bg);color:var(--text);line-height:1.6}
.tags .t-mode{background:var(--acc-bg);color:var(--acc);font-weight:500}
.fresh{display:inline-block;font-size:11.5px;font-weight:600;padding:1px 8px;border-radius:99px;background:var(--strong-bg);color:var(--strong);margin-left:8px;vertical-align:2px}
.why{margin:10px 0 0;font-size:14px;line-height:1.5}
.why .verdict{display:inline-block;font-size:12px;font-weight:600;padding:1px 8px;border-radius:6px;margin-right:6px;vertical-align:1px}
.verdict.v-apply{background:var(--strong-bg);color:var(--strong)} .verdict.v-maybe{background:var(--maybe-bg);color:var(--maybe)}
.verdict.v-skip{background:var(--weak-bg);color:var(--weak)}
.kw{margin:8px 0 0;font-size:13px;color:var(--muted);display:flex;flex-wrap:wrap;gap:5px;align-items:center}
.kw i{font-style:normal;border:1px dashed var(--line);border-radius:6px;padding:0 7px;color:var(--text)}
.actions{grid-column:2;display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-top:14px}
.btn{border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:8px 14px;cursor:pointer;text-decoration:none;font-size:14px}
.btn:hover{border-color:var(--muted)}
.btn.primary{background:var(--acc);color:var(--surface);border-color:var(--acc);font-weight:500}
.btn.primary:hover{filter:brightness(1.08)}
select.status{border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:7px 10px;font-size:14px}
details{grid-column:2;margin-top:10px}
summary{cursor:pointer;color:var(--acc);font-size:14px;font-weight:500}
.kit{margin-top:10px;background:var(--paper);border:1px solid var(--line);border-radius:10px;padding:14px 16px}
.kit h3{font-size:12.5px;margin:0 0 6px;color:var(--muted);font-weight:500}
.kit pre{white-space:pre-wrap;font:inherit;font-size:14px;margin:0 0 10px;line-height:1.55}
.kit ul{margin:0 0 10px;padding-left:18px;font-size:14px}
.empty{padding:36px 24px;color:var(--muted);background:var(--surface);border:1px dashed var(--line);border-radius:14px;text-align:center}
.empty strong{display:block;color:var(--text);font-size:16px;margin-bottom:4px}
header h1 a{color:inherit;text-decoration:none}
.back{display:inline-block;margin-top:10px;font-size:14px;color:var(--muted);text-decoration:none}
.back:hover{color:var(--ink)}
.empty strong{display:block;color:var(--text);font-size:16px;margin-bottom:4px}
footer{margin-top:22px;font-size:13px;color:var(--muted);padding:12px 16px;border-radius:10px;background:var(--surface);border:1px solid var(--line)}
footer p{margin:6px 0 0}
footer ul{padding-left:18px;margin:6px 0 0}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);
  background:var(--ink);color:var(--paper);padding:8px 14px;border-radius:6px;font-size:14px;opacity:0;transition:opacity .2s;pointer-events:none}
.toast.on{opacity:1}
/* ---------- home ---------- */
:root{--hero:#13283F;--hero-text:#F2F6FA;--hero-muted:#A9B8C8;--hero-line:#2A4058;
  --acc-0:#0F766E;--acc-0-bg:#E1F2EF;--acc-1:#4338CA;--acc-1-bg:#E7E6FA;--acc-2:#9A3A86;--acc-2-bg:#F5E6F1}
@media (prefers-color-scheme:dark){:root{--hero:#0C1A28;--hero-text:#E8EEF4;--hero-muted:#8FA2B5;--hero-line:#22364A;
  --acc-0:#5CC8BC;--acc-0-bg:#173430;--acc-1:#A5A1F2;--acc-1-bg:#25244A;--acc-2:#E39AD2;--acc-2-bg:#3A2136}}
#home{margin:-20px calc(50% - 50vw) 0}
.hero{background:var(--hero);color:var(--hero-text);padding:34px 20px 92px}
.hero-in{max-width:1040px;margin:0 auto}
.home-body{max-width:1080px;margin:0 auto}
.hero .date{color:var(--hero-muted);font-size:14px;margin:0}
.hero h1{font-family:"IBM Plex Sans Condensed","IBM Plex Sans",system-ui,sans-serif;font-weight:600;
  font-size:clamp(30px,5.4vw,50px);line-height:1.05;letter-spacing:-.015em;margin:8px 0 26px;max-width:18ch}
.kpis{display:flex;gap:0;flex-wrap:wrap;border-top:1px solid var(--hero-line);padding-top:18px}
.kpi{padding:0 28px 0 0;margin-right:28px;border-right:1px solid var(--hero-line)}
.kpi:last-child{border-right:0;margin-right:0}
.kpi b{display:block;font-family:"IBM Plex Sans Condensed","IBM Plex Sans",system-ui,sans-serif;font-weight:600;
  font-size:40px;line-height:1;font-variant-numeric:tabular-nums}
.kpi span{display:block;color:var(--hero-muted);font-size:13px;margin-top:6px}
.home-body{padding:0 20px 48px}
.boards{display:grid;grid-template-columns:repeat(auto-fit,minmax(290px,1fr));gap:16px;margin-top:-64px}
.board{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:20px;
  display:flex;flex-direction:column;color:inherit;text-decoration:none;
  box-shadow:0 1px 2px rgba(16,32,48,.06),0 8px 24px rgba(16,32,48,.06);transition:transform .15s ease,box-shadow .15s ease}
.board:hover{transform:translateY(-2px);box-shadow:0 2px 4px rgba(16,32,48,.08),0 14px 32px rgba(16,32,48,.10)}
.b-head{display:flex;align-items:center;gap:12px}
.avatar{width:40px;height:40px;border-radius:50%;display:grid;place-items:center;font-weight:600;font-size:16px;
  background:var(--acc-bg);color:var(--acc)}
.b-head .who{font-size:13px;color:var(--muted);line-height:1.2}
.b-head h2{margin:2px 0 0;font-size:17px;font-weight:600;color:var(--text);line-height:1.25}
.b-count{display:flex;align-items:baseline;gap:10px;margin:18px 0 10px}
.b-count b{font-family:"IBM Plex Sans Condensed","IBM Plex Sans",system-ui,sans-serif;font-weight:600;
  font-size:56px;line-height:.9;color:var(--acc);font-variant-numeric:tabular-nums}
.b-count span{color:var(--muted);font-size:14px;line-height:1.3}
.meter{display:flex;height:8px;border-radius:99px;overflow:hidden;background:var(--weak-bg);gap:2px}
.meter i{display:block;height:100%}
.meter .m-s{background:var(--strong)} .meter .m-m{background:var(--maybe)} .meter .m-w{background:var(--line)}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:12.5px;color:var(--muted);margin:8px 0 16px}
.legend em{font-style:normal;display:inline-flex;align-items:center;gap:6px}
.legend em::before{content:"";width:8px;height:8px;border-radius:2px;background:var(--c)}
.tops{list-style:none;margin:0 0 16px;padding:0;border-top:1px solid var(--line)}
.tops li{display:grid;grid-template-columns:52px 1fr;gap:10px;align-items:start;padding:10px 0;border-bottom:1px solid var(--line)}
.chip{font-size:12.5px;white-space:nowrap;font-weight:600;text-align:center;border-radius:6px;padding:3px 0;font-variant-numeric:tabular-nums}
.chip.s-strong{background:var(--strong-bg);color:var(--strong)} .chip.s-maybe{background:var(--maybe-bg);color:var(--maybe)}
.chip.s-weak{background:var(--weak-bg);color:var(--weak)}
.tops .t{font-size:14px;line-height:1.3;font-weight:500;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.tops .c{font-size:12.5px;color:var(--muted);margin-top:2px}
.tops .none{display:block;color:var(--muted);font-size:14px}
.b-go{margin-top:auto;display:flex;justify-content:space-between;align-items:center;
  background:var(--acc);color:var(--surface);border-radius:8px;padding:10px 14px;font-weight:500;font-size:14px}
.b-go small{font-weight:400;opacity:.85;font-size:12.5px}
.home-foot{max-width:1040px;margin:22px auto 0;font-size:13px;color:var(--muted)}
@media (max-width:540px){.kpis{display:grid;grid-template-columns:repeat(3,1fr)}.kpi{padding:0 10px 0 0;margin-right:10px}.kpi b{font-size:28px}.kpi span{font-size:12px}.hero{padding-bottom:84px}}
@media (prefers-reduced-motion:reduce){.board{transition:none}.board:hover{transform:none}}
@media (max-width:540px){
  .job{grid-template-columns:52px 1fr;gap:2px 12px;padding:16px 14px 14px}
  .score b{font-size:22px}
  .actions,details{grid-column:1 / -1}
  .bbody{padding:16px 14px 48px}
}
@media (prefers-reduced-motion:reduce){.toast{transition:none}}
</style>
</head>
<body>
<div class="wrap">
  <section id="home" hidden>
    <div class="hero"><div class="hero-in">
      <p class="date" id="home-date"></p>
      <h1 id="home-hello">Job shortlist</h1>
      <div class="kpis" id="kpis"></div>
    </div></div>
    <div class="home-body">
      <div class="boards" id="boards"></div>
      <p class="home-foot" id="home-foot"></p>
    </div>
  </section>

  <section id="board-view" hidden>
    <div class="bhero"><div class="bhero-in">
      <a class="back" href="#">All shortlists</a>
      <div class="bh-row"><span class="avatar" id="bv-avatar"></span>
        <div><p class="bh-who" id="bv-who"></p><h1 id="bv-title">Job shortlist</h1></div></div>
      <p class="bh-sub" id="updated">Loading today’s jobs…</p>
      <nav class="tabs" role="tablist" id="tabs"></nav>
    </div></div>
    <div class="bbody">
      <div class="views" role="group" aria-label="Show">
        <button class="view" data-view="new" aria-pressed="true">Latest search</button>
        <button class="view" data-view="week" aria-pressed="false">This week</button>
        <button class="view" data-view="mine" aria-pressed="false">My applications</button>
      </div>
      <ol class="list" id="list"></ol>
      <footer id="sources"></footer>
    </div>
  </section>
</div>
<div class="toast" id="toast" role="status" aria-live="polite"></div>

<script>
(function(){
  var STATUS_KEY = "jobshortlist.status.v1";
  var SNAP_KEY = "jobshortlist.snapshots.v1";
  var state = { data:null, scored:{}, tab:null, view:"new" };

  function load(key){ try{ return JSON.parse(localStorage.getItem(key)||"{}"); }catch(e){ return {}; } }
  function save(key,val){ try{ localStorage.setItem(key, JSON.stringify(val)); }catch(e){} }
  var statuses = load(STATUS_KEY), snapshots = load(SNAP_KEY);

  function esc(s){ return String(s==null?"":s).replace(/[&<>"']/g,function(c){
    return {"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;","'":"&#39;"}[c]; }); }

  function toast(msg){ var t=document.getElementById("toast"); t.textContent=msg; t.classList.add("on");
    clearTimeout(toast._t); toast._t=setTimeout(function(){ t.classList.remove("on"); },1800); }

  function getJSON(url){ return fetch(url+"?t="+Date.now(),{cache:"no-store"}).then(function(r){
    if(!r.ok) throw new Error(url+" "+r.status); return r.json(); }); }

  Promise.all([
    getJSON("jobs/data/jobs.json"),
    getJSON("jobs/data/scored.json").catch(function(){ return {jobs:{}}; })
  ]).then(function(res){
    state.data = res[0]; state.scored = (res[1] && res[1].jobs) || {};
    var hash = location.hash.replace("#","");
    var ids = state.data.tabs.map(function(t){ return t.id; });
    state.tab = ids.indexOf(hash) >= 0 ? hash : ids[0];
    state.page = ids.indexOf(hash) >= 0 ? "board" : "home";
    if(!state.data.updated_at){
      document.getElementById("updated").textContent = "No run yet. Open the Actions tab on GitHub, pick Daily jobs and press Run workflow.";
      show(); return;
    }
    var when = new Date(state.data.updated_at);
    var aiDate = res[1] && res[1].date;
    document.getElementById("updated").textContent =
      "Collected " + when.toLocaleString("en-IN",{weekday:"short",day:"numeric",month:"short",hour:"numeric",minute:"2-digit"}) +
      (aiDate ? ". AI review done for " + new Date(aiDate+"T00:00:00").toLocaleDateString("en-IN",{day:"numeric",month:"short"}) + "." : ". AI review not done yet; showing keyword match.");
    show();
  }).catch(function(err){
    document.getElementById("board-view").hidden = false;
    document.getElementById("updated").textContent = "";
    document.getElementById("list").innerHTML =
      '<li class="empty"><strong>No job list found yet.</strong>Run the “Daily jobs” workflow once from the Actions tab on GitHub, then refresh this page. ('+esc(err.message)+')</li>';
  });

  window.addEventListener("hashchange", function(){
    var h = location.hash.replace("#","");
    if(!state.data) return;
    if(state.data.tabs.some(function(t){ return t.id===h; })){ state.tab=h; state.page="board"; }
    else { state.page="home"; }
    show(); window.scrollTo(0,0);
  });

  document.querySelectorAll(".view").forEach(function(b){
    b.addEventListener("click", function(){ state.view=b.dataset.view;
      document.querySelectorAll(".view").forEach(function(x){ x.setAttribute("aria-pressed", String(x===b)); });
      render(); });
  });

  function aiFor(job){
    if(!job) return null;
    return state.scored[job.tab + ":" + job.id] || state.scored[job.id] || null;
  }

  function fit(job){
    var ai = aiFor(job);
    if(ai && typeof ai.score === "number") return { value: ai.score, label:"AI fit /10", cls: ({apply:"s-strong",maybe:"s-maybe",skip:"s-weak"})[String(ai.verdict||"").toLowerCase()] || (ai.score>=7?"s-strong":ai.score>=5?"s-maybe":"s-weak"), sort: ai.score*10 };
    var k = job.keyword_score||0;
    return { value: k, label:"keyword match %", cls: k>=70?"s-strong":k>=50?"s-maybe":"s-weak", sort: k-1 };
  }

  function jobsForView(){
    var d = state.data, tab = state.tab;
    if(state.view === "mine"){
      return Object.keys(statuses).filter(function(id){
        var s = statuses[id]; return s && s.tab===tab && ["applied","interview","offer","rejected"].indexOf(s.value)>=0;
      }).map(function(id){ return snapshots[id]; }).filter(Boolean)
        .sort(function(a,b){ return (statuses[b.id].at||"").localeCompare(statuses[a.id].at||""); });
    }
    return d.jobs.filter(function(j){
      if(j.tab!==tab) return false;
      var s = statuses[j.id] && statuses[j.id].value;
      if(s==="hidden") return false;
      if(state.view==="new") return j.first_seen===d.date && !s;
      return true;
    }).sort(function(a,b){ return fit(b).sort - fit(a).sort; });
  }

  function renderTabs(){
    var d = state.data, nav = document.getElementById("tabs");
    nav.innerHTML = d.tabs.map(function(t){
      var n = d.jobs.filter(function(j){ return j.tab===t.id && j.first_seen===d.date && !(statuses[j.id]); }).length;
      return '<button class="tab" role="tab" aria-selected="'+(t.id===state.tab)+'" data-tab="'+esc(t.id)+'">'+esc(t.label)+'<span class="n">'+n+'</span></button>';
    }).join("");
    nav.querySelectorAll(".tab").forEach(function(b){
      b.addEventListener("click", function(){ state.tab=b.dataset.tab; history.replaceState(null,"","#"+state.tab); render(); });
    });
  }

  var STATUS_OPTS = [["","Not applied"],["saved","Saved for later"],["applied","Applied"],["interview","Interview"],["offer","Offer"],["rejected","Rejected"],["hidden","Not interested"]];

  function jobHTML(j){
    var f = fit(j), ai = aiFor(j) || {};
    var st = (statuses[j.id] && statuses[j.id].value) || "";
    var verdict = ai.verdict ? '<span class="verdict v-'+esc(String(ai.verdict).toLowerCase())+'">'+esc(ai.verdict)+'</span>' : "";
    var why = ai.reason ? '<p class="why">'+verdict+esc(ai.reason)+'</p>' : "";
    var chips = function(arr){ return arr.slice(0,8).map(function(x){ return "<i>"+esc(x)+"</i>"; }).join(""); };
    var missing = ai.missing && ai.missing.length ? '<p class="kw">Missing '+chips(ai.missing)+'</p>'
      : (j.matched && j.matched.length ? '<p class="kw">Matches '+chips(j.matched)+'</p>' : "");
    var tags = [];
    if(j.location) tags.push('<span>'+esc(j.location)+'</span>');
    if(j.work_mode) tags.push('<span class="t-mode">'+esc(j.work_mode)+'</span>');
    if(j.experience_text) tags.push('<span>'+esc(j.experience_text)+'</span>');
    if(j.salary && !/not disclosed/i.test(j.salary)) tags.push('<span>'+esc(j.salary)+'</span>');
    if(j.source) tags.push('<span>'+esc(j.source)+'</span>');
    var fresh = state.data && j.first_seen===state.data.date ? '<span class="fresh">New</span>' : "";

    var kit = "";
    if(ai.message || (ai.bullets && ai.bullets.length)){
      kit = '<details><summary>Application kit</summary><div class="kit">' +
        (ai.message ? '<h3>Message for recruiter or referral</h3><pre>'+esc(ai.message)+'</pre><button class="btn" data-copy="message">Copy message</button> ' : "") +
        (ai.bullets && ai.bullets.length ? '<h3 style="margin-top:14px">Resume points to bring forward</h3><ul>'+ai.bullets.map(function(b){ return "<li>"+esc(b)+"</li>"; }).join("")+'</ul><button class="btn" data-copy="bullets">Copy points</button>' : "") +
        '</div></details>';
    }

    return '<li class="job '+f.cls+'" data-id="'+esc(j.id)+'">' +
      '<div class="score '+f.cls+'"><b>'+esc(f.value)+'</b><small>'+f.label+'</small></div>' +
      '<div><h2>'+esc(j.title)+fresh+'</h2><p class="co">'+esc(j.company||"Company not shown")+'</p>' +
      '<div class="tags">'+tags.join("")+'</div>'+why+missing+'</div>' +
      '<div class="actions">' +
        '<button class="btn primary" data-apply>'+(ai.message?"Copy message and apply":"Open and apply")+'</button>' +
        '<select class="status" aria-label="Status">'+STATUS_OPTS.map(function(o){ return '<option value="'+o[0]+'"'+(o[0]===st?" selected":"")+'>'+o[1]+'</option>'; }).join("")+'</select>' +
      '</div>' + kit + '</li>';
  }

  function show(){
    var home = state.page === "home";
    document.getElementById("home").hidden = !home;
    document.getElementById("board-view").hidden = home;
    if(home) renderHome(); else render();
  }

  function renderHome(){
    var d = state.data, now = new Date(), h = now.getHours();
    var hello = h < 12 ? "Good morning" : h < 17 ? "Good afternoon" : "Good evening";
    var people = [];
    d.tabs.forEach(function(t){ if(people.indexOf(t.person)<0) people.push(t.person); });
    document.getElementById("home-date").textContent = now.toLocaleDateString("en-IN",{weekday:"long",day:"numeric",month:"long"});
    document.getElementById("home-hello").textContent = hello + ", " + people.join(" and ") + ".";

    var APPLIED = ["applied","interview","offer","rejected"];
    var visible = function(j){ var s=statuses[j.id]; return !s || s.value!=="hidden"; };
    var today = d.jobs.filter(function(j){ return j.first_seen===d.date && visible(j); });
    var strong = d.jobs.filter(function(j){ return visible(j) && fit(j).cls==="s-strong"; });
    var applied = Object.keys(statuses).filter(function(id){ return APPLIED.indexOf(statuses[id].value)>=0; }).length;
    var kpi = function(n,l){ return '<div class="kpi"><b>'+n+'</b><span>'+l+'</span></div>'; };
    document.getElementById("kpis").innerHTML = !d.updated_at ? kpi("0","jobs yet. The search runs every night at 9 PM")
      : kpi(today.length,"new in the latest search") + kpi(strong.length,"strong matches this week") + kpi(applied,"applications tracked");

    document.getElementById("boards").innerHTML = d.tabs.map(function(t, i){
      var mine = d.jobs.filter(function(j){ return j.tab===t.id && visible(j); });
      var fresh = mine.filter(function(j){ return j.first_seen===d.date && !statuses[j.id]; });
      var cnt = {"s-strong":0,"s-maybe":0,"s-weak":0};
      mine.forEach(function(j){ cnt[fit(j).cls]++; });
      var total = mine.length || 1;
      var seg = function(c,k){ return cnt[k] ? '<i class="'+c+'" style="width:'+(100*cnt[k]/total)+'%"></i>' : ""; };
      var app = Object.keys(statuses).filter(function(id){ var s=statuses[id]; return s.tab===t.id && APPLIED.indexOf(s.value)>=0; }).length;
      var top = mine.slice().sort(function(a,b){ return fit(b).sort - fit(a).sort; }).slice(0,3);
      var role = t.label.indexOf(",")>=0 ? t.label.split(",").slice(1).join(",").trim() : t.label;
      role = role.charAt(0).toUpperCase() + role.slice(1) + " roles";
      var tops = top.length ? top.map(function(j){
          var f = fit(j), val = f.label.indexOf("/10")>=0 ? f.value + "/10" : f.value + "%";
          return '<li><span class="chip '+f.cls+'">'+esc(val)+'</span><div><div class="t">'+esc(j.title)+'</div><div class="c">'+esc(j.company)+(j.work_mode?", "+esc(j.work_mode):"")+'</div></div></li>';
        }).join("") : '<li><span class="none">No matches yet this week.</span></li>';
      var accent = "--acc:var(--acc-"+(i%3)+");--acc-bg:var(--acc-"+(i%3)+"-bg)";
      return '<a class="board" href="#'+esc(t.id)+'" style="'+accent+'">' +
        '<div class="b-head"><span class="avatar">'+esc(t.person.charAt(0))+'</span><div><div class="who">'+esc(t.person)+'</div><h2>'+esc(role)+'</h2></div></div>' +
        '<div class="b-count"><b>'+fresh.length+'</b><span>new in latest search<br>'+mine.length+' this week</span></div>' +
        '<div class="meter" aria-hidden="true">'+seg("m-s","s-strong")+seg("m-m","s-maybe")+seg("m-w","s-weak")+'</div>' +
        '<div class="legend"><em style="--c:var(--strong)">'+cnt["s-strong"]+' strong</em><em style="--c:var(--maybe)">'+cnt["s-maybe"]+' maybe</em><em style="--c:var(--line)">'+cnt["s-weak"]+' weak</em></div>' +
        '<ul class="tops">'+tops+'</ul>' +
        '<span class="b-go">Open shortlist<small>'+app+' applied</small></span></a>';
    }).join("");

    var foot = document.getElementById("home-foot");
    if(d.updated_at){
      var when = new Date(d.updated_at);
      foot.textContent = "Last search " + when.toLocaleString("en-IN",{day:"numeric",month:"short",hour:"numeric",minute:"2-digit"}) + ". New jobs arrive every night around 9 PM.";
    }
  }

  function roleName(t){
    var r = t.label.indexOf(",")>=0 ? t.label.split(",").slice(1).join(",").trim() : t.label;
    return r.charAt(0).toUpperCase() + r.slice(1) + " roles";
  }

  function paintHeader(){
    var d = state.data, idx = 0;
    d.tabs.forEach(function(t,i){ if(t.id===state.tab) idx=i; });
    var t = d.tabs[idx], bv = document.getElementById("board-view");
    bv.style.setProperty("--acc","var(--acc-"+(idx%3)+")");
    bv.style.setProperty("--acc-bg","var(--acc-"+(idx%3)+"-bg)");
    document.getElementById("bv-avatar").textContent = t.person.charAt(0);
    document.getElementById("bv-who").textContent = t.person + "’s shortlist";
    document.getElementById("bv-title").textContent = roleName(t);
  }

  function render(){
    paintHeader();
    renderTabs();
    var items = jobsForView(), list = document.getElementById("list");
    if(!items.length){
      var msg = state.view==="new" ? ["Nothing new from the latest search.","Check “This week” for earlier jobs, or come back after tonight’s 9 PM search."]
              : state.view==="mine" ? ["No applications tracked here yet.","After you apply, set the job’s status to Applied and it will stay listed here."]
              : ["No jobs in the last 7 days.","The source notes below show what happened on the last run."];
      list.innerHTML = '<li class="empty"><strong>'+msg[0]+'</strong>'+msg[1]+'</li>';
    } else {
      list.innerHTML = items.map(jobHTML).join("");
    }
    list.querySelectorAll(".job").forEach(bindJob);
    renderSources();
  }

  function findJob(id){ return (state.data.jobs.filter(function(j){ return j.id===id && j.tab===state.tab; })[0]) || (state.data.jobs.filter(function(j){ return j.id===id; })[0]) || snapshots[id]; }

  function copy(text){
    if(navigator.clipboard && window.isSecureContext) return navigator.clipboard.writeText(text);
    var ta=document.createElement("textarea"); ta.value=text; document.body.appendChild(ta); ta.select();
    try{ document.execCommand("copy"); }catch(e){} document.body.removeChild(ta); return Promise.resolve();
  }

  function setStatus(job, value){
    if(!value){ delete statuses[job.id]; }
    else { statuses[job.id] = { value:value, tab:job.tab, at:new Date().toISOString() }; }
    if(["applied","interview","offer","rejected"].indexOf(value)>=0){
      var snap = Object.assign({}, job); delete snap.description; snapshots[job.id] = snap;
    }
    save(STATUS_KEY, statuses); save(SNAP_KEY, snapshots);
  }

  function bindJob(li){
    var id = li.dataset.id, job = findJob(id), ai = aiFor(job) || {};
    li.querySelector("[data-apply]").addEventListener("click", function(){
      var go = function(){ window.open(job.apply_url || job.url, "_blank", "noopener"); };
      if(ai.message){ copy(ai.message).then(function(){ toast("Message copied. Paste it in the application."); go(); }); }
      else go();
      if(!statuses[id]){ setStatus(job, "saved"); li.querySelector("select").value="saved"; }
    });
    li.querySelector("select").addEventListener("change", function(e){
      setStatus(job, e.target.value);
      toast(e.target.value==="hidden" ? "Hidden from your list." : "Status saved on this device.");
      if(e.target.value==="hidden" || state.view==="new") render();
    });
    li.querySelectorAll("[data-copy]").forEach(function(b){
      b.addEventListener("click", function(){
        var t = b.dataset.copy==="message" ? ai.message : (ai.bullets||[]).map(function(x){ return "• "+x; }).join("\n");
        copy(t).then(function(){ toast("Copied."); });
      });
    });
  }

  function renderSources(){
    var d = state.data, log = (d.run_log||[]).filter(function(r){ return r.tab===state.tab; })[0];
    if(!log){ document.getElementById("sources").innerHTML=""; return; }
    var dropped = Object.keys(log.dropped||{}).map(function(k){ return k+" ("+log.dropped[k]+")"; }).join(", ");
    var errs = (log.errors||[]).map(function(e){ return "<li>"+esc(e.length>140? e.slice(0,140)+"…" : e)+"</li>"; }).join("");
    document.getElementById("sources").innerHTML =
      "Last run: "+log.fetched+" jobs collected, "+log.new+" new kept." +
      (dropped ? " Filtered out: "+esc(dropped)+"." : "") +
      (errs ? "<ul>"+errs+"</ul>" : "") +
      "<p>Statuses are saved on this device only.</p>";
  }
})();
</script>
</body>
</html>
